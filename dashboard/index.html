<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Mesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ── palette, sampled from the source capture ─────────────────────────── */
:root{
  --bone:#ede9e1;
  --panel:#f7f5f1;
  --ink:#14120e;
  --ink-soft:#6b6862;
  --ink-faint:#9a958c;
  --rule:#1b1711;
  --hair:rgba(20,18,14,.14);
  --rust:#c9604d;
  --rust-deep:#b8614f;
  --rust-pale:#dea296;
  --rust-wash:#f4ded8;
  --entity:#cb6455;
  --claim:#ab4433;
  --source:#ca957a;
  --decision:#e3d5b8;
  --green:#4f7c5f;
  --green-soft:#82b795;
  --green-wash:#dff0e4;
  --gap:10px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bone);
  color:var(--ink);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  line-height:1.35;
  font-variant-ligatures:none;
}

.sheet{
  width:100%;
  max-width:1440px;
  margin:0 auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
}

/* ── shared furniture ─────────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--rule);position:relative}
.pad{padding:12px 14px}
.ptitle{font-size:15px;font-weight:800;letter-spacing:.045em;text-transform:uppercase;margin:0}
.ptitle .accent{color:var(--rust)}
.psub{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft)}
.badge{
  border:1px solid var(--rust);color:var(--rust);
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;white-space:nowrap;font-weight:700;
}
.badge.good{border-color:var(--green);color:var(--green)}
.badge.ink{border-color:var(--rule);color:var(--ink)}
.badge.solid{background:var(--rust);color:#fff;border-color:var(--rust)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dot{width:7px;height:7px;display:inline-block;vertical-align:middle;margin-right:6px}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.footnote{
  border-top:1px solid var(--hair);margin-top:10px;padding-top:7px;
  display:flex;justify-content:space-between;gap:10px;
  font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
}

/* corner brackets */
.bracketed{position:relative}
.bracketed .cnr{position:absolute;width:7px;height:7px;border:1px solid currentColor;opacity:.55}
.bracketed .tl{top:4px;left:4px;border-right:0;border-bottom:0}
.bracketed .tr{top:4px;right:4px;border-left:0;border-bottom:0}
.bracketed .bl{bottom:4px;left:4px;border-right:0;border-top:0}
.bracketed .br{bottom:4px;right:4px;border-left:0;border-top:0}

/* ── masthead ─────────────────────────────────────────────────────────── */
.masthead{display:flex;align-items:stretch;gap:0;border:1px solid var(--rule);background:var(--panel)}
.mark{
  width:74px;flex:0 0 74px;background:var(--rust);
  display:flex;align-items:center;justify-content:center;border-right:1px solid var(--rule);
}
.mark svg{width:40px;height:40px;display:block}
.wordmark{flex:1 1 auto;padding:11px 16px;border-right:1px solid var(--rule);min-width:0}
.wordmark h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark h1 .g{color:var(--rust)}
.kicker{margin-top:4px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;align-items:center;gap:22px;padding:11px 16px;border-right:1px solid var(--rule)}
.stat .label{white-space:pre-line;line-height:1.25}
.stat .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.rust .v{color:var(--rust)}
.stat.green .v{color:var(--green)}
.sparkbox{display:flex;align-items:flex-end;padding:11px 10px;border-right:1px solid var(--rule);flex:0 0 auto}
.clockbox{padding:9px 14px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;flex:0 0 auto}
.clock{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#spark{display:block}
.trav{border:1px solid var(--green-soft);color:var(--green);padding:4px 9px;text-align:right;font-size:9px;letter-spacing:.1em;line-height:1.5;font-weight:700}
.trav b{display:block;font-size:11px}

/* ── build strip ──────────────────────────────────────────────────────── */
.strip{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 14px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
}
.strip .meta{color:var(--ink);font-weight:700}
.strip .sep{width:1px;align-self:stretch;background:var(--hair)}
.stages{display:flex;align-items:center;gap:8px;flex:1 1 auto;flex-wrap:wrap}
.stagechip{padding:3px 7px;border:1px solid transparent;color:var(--ink-faint);font-weight:700;white-space:nowrap}
.stagechip.on{background:var(--rust);border-color:var(--rust);color:#fff}
.leader{flex:1 1 14px;min-width:14px;border-top:1px dashed var(--ink-faint);opacity:.6}

/* ── build path ───────────────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:12px;align-items:stretch}
.card{
  border:1px solid var(--rule);padding:12px 12px 11px;position:relative;
  background:var(--panel);color:var(--ink);min-height:66px;
}
.card + .card{margin-left:14px}
.card .n{font-size:8px;letter-spacing:.16em;color:var(--ink-faint)}
.card .t{font-size:14px;font-weight:800;letter-spacing:.02em;margin-top:5px}
.card .c{font-size:9px;letter-spacing:.06em;color:var(--ink-soft);margin-top:4px}
.card.on{background:var(--rust);border-color:var(--rust);color:#fff}
.card.on .n,.card.on .c{color:rgba(255,255,255,.82)}
.arrow{
  position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  color:var(--rust);font-size:11px;line-height:1;z-index:2;
}
.rail{margin-top:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.railend .label{font-size:8.5px}
.railend .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--rust)}
.railend.right{text-align:right}
.railend.right .v{color:var(--green)}
#railcanvas{display:block;width:100%;height:34px}

/* ── graph ────────────────────────────────────────────────────────────── */
.graphwrap{position:relative}
#mesh{display:block;width:100%;height:590px}
.legend{position:absolute;left:14px;top:56px;z-index:3}
.legend .row{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:9.5px;letter-spacing:.07em}
.legend .row b{font-weight:700;min-width:74px}
.legend .row i{font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;display:inline-block;border:1px solid rgba(20,18,14,.35)}
.phasebox{
  position:absolute;right:14px;top:52px;z-index:3;border:1px solid var(--rust);
  padding:6px 10px;background:var(--panel);max-width:270px;
}
.phasebox .p{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--rust);text-transform:uppercase}
.phasebox .d{font-size:8.5px;letter-spacing:.09em;color:var(--ink-soft);text-transform:uppercase;margin-top:3px}
.clusterlabel{
  position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-50%);
  border:1px solid var(--rust);background:var(--panel);
  padding:3px 8px;font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);white-space:nowrap;
}

/* ── metric row ───────────────────────────────────────────────────────── */
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gap)}
.row2{display:grid;grid-template-columns:2.15fr 1fr;gap:var(--gap)}

/* hop budget */
.hops{display:flex;align-items:flex-end;gap:5px;height:104px;margin-top:14px;position:relative}
.hopcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hopcol .v{font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px;color:var(--ink)}
.hopcol .bar{width:100%;background:var(--decision);border:1px solid rgba(20,18,14,.25);transition:height .5s ease}
.hopcol.median .bar{background:var(--rust);border-color:var(--rust)}
.hopaxis{display:flex;gap:5px;margin-top:5px}
.hopaxis span{flex:1;text-align:center;font-size:9px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.p50{position:absolute;top:-2px;bottom:0;border-left:1px dashed var(--ink);opacity:.55}
.p50 em{position:absolute;top:-11px;left:3px;font-style:normal;font-size:8px;letter-spacing:.1em;color:var(--ink-soft)}

/* edge ledger */
.ledger{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.lrow{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center}
.lrow .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.track{height:15px;background:rgba(20,18,14,.07);position:relative;overflow:hidden}
.fill{
  height:100%;position:absolute;left:0;top:0;transition:width .6s ease;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 1px,transparent 1px 6px);
}
.caret{position:absolute;top:0;bottom:0;width:0;height:0;transition:left .6s ease;
  border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:6px solid var(--ink);opacity:.65}
.lrow .n{text-align:right;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}

/* walk vs flat */
#wvf{display:block;width:100%;height:104px;margin-top:14px}
.wvflegend{display:flex;gap:16px;margin-top:8px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

/* traversal grid */
.gridlegend{display:flex;gap:14px;justify-content:flex-end;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
.grid{
  display:grid;grid-template-columns:repeat(72,1fr);gap:2px;margin-top:12px;
}
.cell{aspect-ratio:1/1;background:var(--rust-pale);opacity:.9}
.cell.dead{background:transparent;border:1px solid var(--rust-pale);border-radius:50%}
.cell.fresh{background:var(--rust)}
.cell.empty{background:rgba(20,18,14,.05)}

/* dead-end ledger */
.bignum{font-size:44px;font-weight:800;color:var(--rust);line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.dend{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.drow .top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.drow .top i{font-style:normal;font-variant-numeric:tabular-nums}
.dtrack{height:4px;background:rgba(20,18,14,.09);margin-top:4px;position:relative}
.dfill{height:100%;transition:width .6s ease}
.ontology{border:1px solid var(--rule);margin-top:14px;padding:10px 11px;background:var(--panel)}
.ontology .f{font-size:16px;font-weight:800;color:var(--rust);margin-top:5px}
#walktime{display:block;width:100%;height:52px;margin-top:8px}
.ostats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px;text-align:center}
.ostats .k{font-size:8px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.ostats .v{font-size:15px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;margin-top:2px}

/* footer */
.footer{
  display:flex;justify-content:space-between;gap:12px;padding:2px 4px 6px;
  font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);
}
.footer .accent{color:var(--rust)}
.footer b{color:var(--ink);font-weight:800}

@media (max-width:1080px){
  .row3{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(3,1fr);gap:14px}
  .card+.card{margin-left:0}
  .arrow{display:none}
  .stats{gap:14px}
  .grid{grid-template-columns:repeat(36,1fr)}
}
@media (max-width:720px){
  .masthead{flex-wrap:wrap}
  .wordmark h1{font-size:20px;white-space:normal}
  .cards{grid-template-columns:repeat(2,1fr)}
  .clockbox{flex:1 1 100%;align-items:flex-start;border-top:1px solid var(--rule)}
  #spark{display:none}
}
</style>
</head>
