name: Branding sync temporary

on:
  push:
    branches:
      - docs/standardize-contextmesh-branding

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Standardize ContextMesh branding
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('README.md'), Path('RELEASE_NOTES.md'), Path('pyproject.toml')]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('Deep-Sixed/Context-Mesh', 'Deep-Sixed/ContextMesh')
              if path.name in {'README.md', 'RELEASE_NOTES.md'}:
                  text = text.replace('Context Mesh', 'ContextMesh')
              if path.name == 'README.md':
                  text = text.replace('cd Context-Mesh', 'cd ContextMesh')
              if path.name == 'RELEASE_NOTES.md':
                  text = text.replace(
                      'The release tag and any package publication are separate explicit gates after the\nrelease-candidate audit passes.',
                      'Package publication remains a separate explicit gate.',
                  )
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- README.md RELEASE_NOTES.md pyproject.toml
      - name: Commit branding changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md RELEASE_NOTES.md pyproject.toml
          git diff --cached --quiet && exit 0
          git commit -m 'Standardize ContextMesh branding'
          git push
