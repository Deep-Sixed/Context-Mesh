name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # contextmesh has no dependencies; if that ever stops being true this
      # step is where it will show up, as an ImportError rather than a surprise.
      - name: Run the suite
        # The MCP SDK is deliberately absent here: the read-boundary tests
        # import contextmesh_mcp.tools, which does not depend on it, so the
        # safety cases run on every version the core supports. The two
        # server-registration tests skip and are covered by the mcp job.
        run: python -m unittest discover -s tests -v

  test-windows:
    name: windows tests · python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the meaningful suite on Windows
        run: python -m unittest discover -s tests -v
      - name: The demo CLI degrades deterministically on cp1252
        shell: bash
        run: |
          python - <<'EOF'
          import io, sys
          from contextlib import redirect_stdout
          from contextmesh import cli

          raw = io.BytesIO()
          stream = io.TextIOWrapper(raw, encoding="cp1252")
          sys.stdout = stream
          with redirect_stdout(stream):
              assert cli.main(["--rounds", "1", "demo"]) == 0
          stream.flush()
          out = raw.getvalue().decode("cp1252")
          assert "BUILD PATH * what earns a node in the graph" in out
          assert "committed -> walkable" in out
          print("CP1252 CLI FALLBACK OK", file=sys.__stdout__)
          EOF

  persistence-contract:
    name: persistence contract · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove the unchanged cross-process persistence contract
        run: python -m unittest -v tests.test_session.ProcessBoundaryTest.test_one_process_writes_and_another_reads tests.test_session.ProcessLockTest.test_a_reader_holding_the_manifest_does_not_block_publication tests.test_session.ProcessLockTest.test_the_second_writer_is_refused_then_succeeds_on_retry tests.test_session.ProcessLockTest.test_a_crash_before_publication_leaves_the_committed_generation_serving tests.test_session.ProcessLockTest.test_a_writer_killed_mid_transaction_does_not_hold_the_lock

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned on purpose. An unpinned `pipx install ruff` makes every new ruff
      # release a potential red build on an unchanged tree, and the version that
      # passes here should be the version a contributor can reproduce. Bump it
      # deliberately, with whatever fixes the new release asks for.
      - run: pipx install ruff==0.16.5
      # The whole repository, not a path list: a new top-level .py should not
      # have to be remembered to be linted. `examples/` and `ops/` were outside
      # the old list and had accumulated 22 findings.
      - run: ruff check .

  package:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build both distributions without deprecated license metadata
        run: |
          python -m build 2>&1 | tee /tmp/build.txt
          ! grep -F "project.license as a TOML table is deprecated" /tmp/build.txt
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

  leaks:
    name: no private data
    # Scoped to what the pull request adds, so a PR is judged on its own commits.
    # Run `ops/leak-check.sh` with no argument to audit the whole history.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nothing private in what this PR adds
        # An exact SHA, not a ref name: `git fetch origin <branch>` updates only
        # FETCH_HEAD, so origin/<branch> need not exist in the runner's checkout
        # and the range would silently cover the wrong commits.
        run: ops/leak-check.sh "${{ github.event.pull_request.base.sha }}"

  mcp:
    name: mcp · controlled server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the optional MCP extra
        run: pip install -e '.[mcp]'

      - name: Installing the core alone pulls no dependencies
        run: |
          python - <<'EOF'
          import subprocess, sys, tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data["project"]["dependencies"]
          assert deps == [], f"contextmesh must stay dependency-free, found {deps}"
          assert data["project"]["requires-python"] == ">=3.9"
          print("core: 0 dependencies, requires-python >=3.9")
          EOF

      - name: The server separates seven reads from controlled writes
        run: |
          python - <<'EOF' | tee /tmp/mcp.txt
          import asyncio
          from contextmesh_mcp import server, tools, writes
          published = sorted(t.name for t in asyncio.run(server.mcp.list_tools()))
          print("read tools:", tools.names())
          print("write tools:", writes.names())
          print("published:", published)
          assert tools.names() == [
              "mesh_ask",
              "mesh_blast_radius",
              "mesh_explain_as_of",
              "mesh_get_node",
              "mesh_health",
              "mesh_lineage",
              "mesh_reconstruct_decision",
          ]
          assert writes.names() == [
              "mesh_recheck",
              "mesh_repair",
              "mesh_resume",
              "mesh_submit_evidence",
          ]
          assert published == sorted([*tools.names(), *writes.names()])
          direct = {"mesh_reject", "mesh_invalidate", "mesh_set_status", "mesh_add_edge"}
          assert direct.isdisjoint(published), direct & set(published)
          uris = sorted(str(r.uri) for r in asyncio.run(server.mcp.list_resources()))
          print("resources:", uris)
          templates = sorted(
              t.uri_template for t in asyncio.run(server.mcp.list_resource_templates())
          )
          print("templates:", templates)
          assert "contextmesh://node/{node_id}" in templates
          print("CONTROLLED MCP SURFACE OK")
          EOF
          grep -q "CONTROLLED MCP SURFACE OK" /tmp/mcp.txt

      - name: The full suite, with the SDK present so nothing skips
        run: |
          python -m unittest discover -s tests 2>&1 | tee /tmp/suite.txt
          # If the server tests skipped here, the mcp job is not testing the SDK.
          ! grep -qi "skipped" /tmp/suite.txt

      - name: The server serves the session it loaded, not a fresh demo
        run: |
          contextmesh-mcp --demo --rounds 4 --save /tmp/served
          python - <<'EOF' | tee /tmp/adopt.txt
          from contextmesh_mcp import server, session as sessionmod
          # Stop before the transport: what is under test is which graph the
          # tool handlers would answer from, not stdio.
          server.mcp.run = lambda **kw: None
          assert server.main(["--session", "/tmp/served"]) == 0
          served = sessionmod.session()
          described = served.describe()
          print("persistent:", described["persistent"], "| path:", served.path)
          assert described["persistent"], "the server built a demo instead of loading"
          assert str(served.path) == "/tmp/served", served.path
          print("ADOPTED THE LOADED SESSION")
          EOF
          grep -q "ADOPTED THE LOADED SESSION" /tmp/adopt.txt

      - name: The server refuses a bad session before opening the transport
        run: |
          contextmesh-mcp --demo --rounds 2 --save /tmp/bad
          python -c "import json,pathlib;from contextmesh_mcp.session import live_manifest_path;p=live_manifest_path(pathlib.Path('/tmp/bad'));assert p is not None;d=json.loads(p.read_text());d['version']=99;p.write_text(json.dumps(d))"
          if contextmesh-mcp --session /tmp/bad 2>/tmp/bad.txt; then
            echo "::error::the server accepted a session it cannot restore"; exit 1
          fi
          grep -q "cannot be read by this build" /tmp/bad.txt

  session:
    name: session · survives a restart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The oldest supported version: writing and reading a session must
          # not quietly need the MCP extra, or 3.10.
          python-version: "3.9"

      - name: One process writes the session
        run: |
          python -m contextmesh_mcp --demo --rounds 4 --save /tmp/session | tee /tmp/wrote.txt
          test -f /tmp/session/session.json
          python - <<'EOF'
          import json, pathlib
          root = pathlib.Path("/tmp/session")
          data = json.loads((root / "session.json").read_text())
          assert data["generation"] == 1, data["generation"]
          assert (root / "session-000001.json").is_file(), "no immutable manifest"
          assert data["graph"] == "graph-000001.json", data["graph"]
          assert data["resolver"] == "resolver-000001.json", data["resolver"]
          for key in ("graph", "resolver"):
              assert (root / data[key]).is_file(), data[key]
          assert (root / "session.lock").is_file(), "no writer lock"
          print("committed generation 1:", sorted(p.name for p in root.iterdir()))
          EOF

      - name: Another process reads it, and gets the same graph
        run: |
          python -m contextmesh_mcp --session /tmp/session > /tmp/read.json
          python - <<'EOF' | tee /tmp/same.txt
          import json
          from contextmesh_mcp.session import Session
          read = json.load(open("/tmp/read.json"))
          fresh = Session.build(rounds=4).describe()
          assert read["persistent"] is True, read
          for key in ("nodes_live", "nodes_total", "edges_live", "edges_total",
                      "assumptions", "build", "rounds"):
              assert read[key] == fresh[key], (key, read[key], fresh[key])
          print(f"{read['nodes_live']}/{read['nodes_total']} nodes, "
                f"{read['edges_live']}/{read['edges_total']} edges, restored")
          print("SESSION CROSSED THE PROCESS BOUNDARY")
          EOF
          grep -q "SESSION CROSSED THE PROCESS BOUNDARY" /tmp/same.txt

      - name: A resolution the graph never stored survives the restart
        run: |
          python - <<'EOF' | tee /tmp/alias.txt
          import json, pathlib
          from contextmesh.resolve import Resolver
          from contextmesh_mcp.session import Session
          root = pathlib.Path("/tmp/session")
          names = json.loads((root / "session.json").read_text())
          saved = json.loads((root / names["resolver"]).read_text())
          registered = Resolver()
          for eid, label in saved["canonical"].items():
              registered.register(eid, label)
          learned = sorted(set(saved["aliases"]) - set(registered.aliases))
          assert learned, "the demo should learn aliases while it walks"
          restored = Session.load("/tmp/session")
          record = restored.resolver.resolve(learned[0])
          print(f"{len(learned)} learned aliases; {learned[0]!r} -> "
                f"{record.canonical_id} via {record.reason}")
          assert record.reason == "alias table", record.reason
          assert record.canonical_id == saved["aliases"][learned[0]]
          print("LEARNED ALIAS SURVIVED")
          EOF
          grep -q "LEARNED ALIAS SURVIVED" /tmp/alias.txt

      - name: Re-saving a restored session reproduces it byte for byte
        run: |
          python -m contextmesh_mcp --session /tmp/session --save /tmp/again > /dev/null
          python - <<'EOF'
          import json, pathlib
          a, b = pathlib.Path("/tmp/session"), pathlib.Path("/tmp/again")
          ma = json.loads((a / "session.json").read_text())
          mb = json.loads((b / "session.json").read_text())
          # A save into a fresh directory commits generation 1, so the whole
          # manifest must match: the counter belongs to the directory.
          assert ma == mb, "manifests differ across a save/load/save cycle"
          for key in ("graph", "resolver"):
              assert (a / ma[key]).read_bytes() == (b / mb[key]).read_bytes(), key
          print("save/load/save is byte-identical at generation", ma["generation"])
          EOF

      - name: A session this build cannot restore is refused, not half-loaded
        run: |
          set +e
          break_it() {
            rm -rf /tmp/broken && cp -r /tmp/session /tmp/broken
            python - "$1" <<'EOF'
          import json, pathlib, sys
          from contextmesh_mcp.session import live_manifest_path
          how = sys.argv[1]
          root = pathlib.Path("/tmp/broken")
          sfile = live_manifest_path(root)
          assert sfile is not None
          data = json.loads(sfile.read_text())
          if how == "version":
              data["version"] = 99
          elif how == "escape":
              data["graph"] = "../../etc/passwd"
          elif how == "rounds":
              data["rounds"] = True
          elif how == "policy":
              data["walker"]["policy"] = ["teleports_to"]
          elif how == "missing":
              (root / data["graph"]).unlink()
          elif how == "foreign":
              r = json.loads((root / data["resolver"]).read_text())
              r["canonical"]["entity:ghost"] = "Ghost"
              (root / data["resolver"]).write_text(json.dumps(r))
          elif how == "renamed":
              # A resolver that is internally consistent and still disagrees
              # with the graph: same id, right type, different name. Only the
              # session can see it, so the log is renamed to match and the
              # refusal has to come from check_agreement.
              r = json.loads((root / data["resolver"]).read_text())
              entity = next(iter(r["canonical"]))
              r["canonical"][entity] = "Not What The Graph Calls It"
              for row in r["log"]:
                  if row["canonical_id"] == entity:
                      row["canonical_label"] = "Not What The Graph Calls It"
              (root / data["resolver"]).write_text(json.dumps(r))
          elif how == "generation":
              data["generation"] = 9
          elif how == "symlink":
              companion = root / data["graph"]
              elsewhere = root.parent / "escaped-graph.json"
              elsewhere.write_text(companion.read_text())
              companion.unlink()
              companion.symlink_to(elsewhere)
          sfile.write_text(json.dumps(data))
          EOF
            python -m contextmesh_mcp --session /tmp/broken >/dev/null 2>/tmp/why.txt
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "::error::a session broken by '$1' loaded anyway"; exit 1
            fi
            echo "  refused ($1): $(head -c 110 /tmp/why.txt)"
          }
          for how in version escape rounds policy missing foreign renamed generation symlink; do
            break_it "$how" || exit 1
          done
          echo "EVERY BROKEN SESSION REFUSED"

      - name: A question asked after startup outlives the process that asked it
        run: |
          python - <<'EOF' | tee /tmp/served.txt
          import json, pathlib, subprocess, sys
          from contextmesh_mcp.session import Session

          root = "/tmp/session"
          named = json.loads((pathlib.Path(root) / "session.json").read_text())
          saved = json.loads((pathlib.Path(root) / named["resolver"]).read_text())
          mention = "PG Vector"
          assert mention.lower() not in saved["aliases"], "fixture already knows it"

          # A separate interpreter asks, checkpoints, and exits. Nothing but
          # the directory crosses between it and the assertions below.
          script = (
              "import sys\n"
              "from contextmesh_mcp.session import Session, Checkpointer\n"
              "from contextmesh_mcp import tools\n"
              "s = Session.load(sys.argv[1])\n"
              "c = Checkpointer(s)\n"
              "for q in sys.argv[2:]:\n"
              "    tools.call(s, 'mesh_ask', {'question': q})\n"
              "    c.record_mutation()\n"
              "print(c.commits)\n"
          )
          before = Session.load(root)
          state = lambda s: (
              len(s.resolver.aliases),
              len(s.resolver.log),
              sum(n.walks for n in s.graph.nodes.values()),
              sum(e.traversals for e in s.graph.edges.values()),
          )
          was = state(before)

          proc = subprocess.run(
              [sys.executable, "-c", script, root,
               f"What does {mention} depend on?",
               "What contradicts the sharding assumption?"],
              capture_output=True, text=True,
          )
          assert proc.returncode == 0, proc.stderr
          assert proc.stdout.strip() == "2", proc.stdout

          after = Session.load(root)
          now = state(after)
          print("aliases/log/walks/traversals", was, "->", now)
          assert all(b > a for a, b in zip(was, now)), (was, now)
          assert after.generation > before.generation, after.generation

          record = after.resolver.resolve(mention)
          print(f"{mention!r} -> {record.canonical_id} via {record.reason}")
          assert record.reason == "alias table", record.reason
          print("SERVED MUTATIONS SURVIVED THE PROCESS")
          EOF
          grep -q "SERVED MUTATIONS SURVIVED THE PROCESS" /tmp/served.txt

      - name: A save never writes to a file the live manifest names
        run: |
          python - <<'EOF' | tee /tmp/atomic.txt
          import json, os, pathlib, shutil
          from contextmesh_mcp.session import Session, live_manifest_path

          shutil.rmtree("/tmp/gen", ignore_errors=True)
          shutil.copytree("/tmp/session", "/tmp/gen")
          root = pathlib.Path("/tmp/gen")
          live = live_manifest_path(root)
          assert live is not None
          session = Session.load(root)

          # A reader holding an immutable manifest across the commit must still
          # see the previous generation whole, even if the sweep unlinks its
          # old pathname after publishing the next manifest.
          with open(live, encoding="utf-8") as reader:
              session.checkpoint()
              held = json.loads(reader.read())
          assert held["generation"] == session.generation - 1, held["generation"]
          assert (root / held["graph"]).name == held["graph"]

          committed_live = live_manifest_path(root)
          assert committed_live is not None
          assert committed_live != live, "the manifest was written in place"
          committed = json.loads(committed_live.read_text())
          assert committed["generation"] == held["generation"] + 1
          leftovers = sorted(p.name for p in root.iterdir())
          assert leftovers == sorted(
              ["session.json", f"session-{committed['generation']:06d}.json",
               "session.lock", "session.lock.meta",
               committed["graph"], committed["resolver"]]
          ), leftovers
          print("generation", held["generation"], "->", committed["generation"], leftovers)
          print("COMMIT IS ATOMIC AND SWEPT")
          EOF
          grep -q "COMMIT IS ATOMIC AND SWEPT" /tmp/atomic.txt

      - name: An interrupted save leaves the previous generation serving
        run: |
          python - <<'EOF' | tee /tmp/interrupted.txt
          import json, pathlib, shutil
          from contextmesh_mcp.session import Session

          shutil.rmtree("/tmp/torn", ignore_errors=True)
          shutil.copytree("/tmp/session", "/tmp/torn")
          root = pathlib.Path("/tmp/torn")
          data = json.loads((root / "session.json").read_text())
          nxt = data["generation"] + 1

          # Exactly what a crash between the companions and the swap leaves:
          # a complete new graph, a half-written new resolver, old manifest.
          Session.load(root).graph.save_json(root / f"graph-{nxt:06d}.json")
          (root / f"resolver-{nxt:06d}.json").write_text('{"schema": "contextmes')

          back = Session.load(root)
          assert back.generation == data["generation"], back.generation
          print("still serving generation", back.generation)

          # And the next real save clears the wreckage rather than tripping on it.
          back.checkpoint()
          after = json.loads((root / "session.json").read_text())
          leftovers = sorted(p.name for p in root.iterdir())
          assert leftovers == sorted(
              ["session.json", f"session-{after['generation']:06d}.json",
               "session.lock", "session.lock.meta",
               after["graph"], after["resolver"]]
          ), leftovers
          print("recovered to generation", after["generation"], leftovers)
          print("INTERRUPTED SAVE DID NOT MIX GENERATIONS")
          EOF
          grep -q "INTERRUPTED SAVE DID NOT MIX GENERATIONS" /tmp/interrupted.txt

      - name: Two writers cannot corrupt one session directory
        run: |
          python - <<'EOF' | tee /tmp/concurrent.txt
          import json, pathlib, shutil, subprocess, sys, time
          from contextmesh_mcp.session import Session

          shutil.rmtree("/tmp/race", ignore_errors=True)
          shutil.copytree("/tmp/session", "/tmp/race")
          root = pathlib.Path("/tmp/race")
          gate = pathlib.Path("/tmp/race-gate")
          done = pathlib.Path("/tmp/race-done")
          for path in (gate, done):
              if path.exists():
                  path.unlink()
          start = json.loads((root / "session.json").read_text())["generation"]

          # A stalls in the window between the manifest swap and the sweep --
          # the interleaving that used to leave a manifest naming files the
          # other writer had already had deleted out from under it.
          stall = (
              "import sys, time\n"
              "from pathlib import Path\n"
              "from contextmesh_mcp.session import Session\n"
              "root, gate, done = (Path(a) for a in sys.argv[1:4])\n"
              "original = Session._sweep\n"
              "def stalling(directory, keep):\n"
              "    gate.write_text('committed')\n"
              "    limit = time.time() + 60\n"
              "    while not done.exists() and time.time() < limit:\n"
              "        time.sleep(0.02)\n"
              "    original(directory, keep)\n"
              "Session._sweep = staticmethod(stalling)\n"
              "Session.load(root).checkpoint()\n"
              "print('A-DONE')\n"
          )
          contend = (
              "import sys, time\n"
              "from pathlib import Path\n"
              "from contextmesh_mcp.session import Session, SessionLockedError\n"
              "root, gate, done = (Path(a) for a in sys.argv[1:4])\n"
              "limit = time.time() + 60\n"
              "while not gate.exists() and time.time() < limit:\n"
              "    time.sleep(0.02)\n"
              "try:\n"
              "    Session.load(root).checkpoint()\n"
              "    print('B-COMMITTED-IN-WINDOW')\n"
              "except SessionLockedError as exc:\n"
              "    print('B-REFUSED')\n"
              "finally:\n"
              "    done.write_text('done')\n"
              "time.sleep(1.0)\n"
              "again = Session.load(root)\n"
              "again.checkpoint()\n"
              "print('B-RETRY', again.generation)\n"
          )
          args = [str(root), str(gate), str(done)]
          a = subprocess.Popen([sys.executable, "-c", stall, *args],
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          b = subprocess.Popen([sys.executable, "-c", contend, *args],
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          ao, ae = a.communicate(timeout=180)
          bo, be = b.communicate(timeout=180)
          print("A:", ao.strip() or ae.strip()[-200:])
          print("B:", bo.strip() or be.strip()[-200:])
          assert a.returncode == 0, ae
          assert b.returncode == 0, be
          assert "A-DONE" in ao, ao
          assert "B-REFUSED" in bo, bo
          assert "B-COMMITTED-IN-WINDOW" not in bo, bo
          assert f"B-RETRY {start + 2}" in bo, bo

          # The directory has to be intact: manifest loads, both companions
          # present, generation monotonic, nothing committed swept.
          final = json.loads((root / "session.json").read_text())
          assert final["generation"] == start + 2, final["generation"]
          for key in ("graph", "resolver"):
              assert (root / final[key]).is_file(), final[key]
          assert Session.load(root).generation == start + 2
          print("generations", start, "->", final["generation"],
                sorted(p.name for p in root.iterdir()))
          print("CONCURRENT WRITERS SERIALISED")
          EOF
          grep -q "CONCURRENT WRITERS SERIALISED" /tmp/concurrent.txt

      - name: A writer killed mid-transaction does not hold the lock
        run: |
          python - <<'EOF' | tee /tmp/killed.txt
          import json, pathlib, shutil, subprocess, sys, time
          from contextmesh_mcp.session import Session, SessionLockedError

          shutil.rmtree("/tmp/killed", ignore_errors=True)
          shutil.copytree("/tmp/session", "/tmp/killed")
          root = pathlib.Path("/tmp/killed")
          gate = pathlib.Path("/tmp/killed-gate")
          if gate.exists():
              gate.unlink()
          before = json.loads((root / "session.json").read_text())["generation"]

          holder = subprocess.Popen(
              [sys.executable, "-c",
               "import sys, time\n"
               "from pathlib import Path\n"
               "from contextmesh_mcp.session import writer_lock\n"
               "root, gate = Path(sys.argv[1]), Path(sys.argv[2])\n"
               "with writer_lock(root):\n"
               "    gate.write_text('held')\n"
               "    time.sleep(300)\n",
               str(root), str(gate)],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          )
          limit = time.time() + 60
          while not gate.exists() and time.time() < limit:
              time.sleep(0.02)
          assert gate.exists(), "the holder never took the lock"

          try:
              Session.load(root).checkpoint()
              raise SystemExit("::error::a save ran while another writer held the lock")
          except SessionLockedError as exc:
              print("refused while held:", str(exc)[:100])

          # The lock is kernel-held, so SIGKILL releases it. No stale-lock
          # heuristic, no pid liveness guessing.
          holder.kill()
          holder.communicate(timeout=60)
          Session.load(root).checkpoint()
          after = json.loads((root / "session.json").read_text())["generation"]
          assert after == before + 1, (before, after)
          print("generation", before, "->", after, "after the holder was killed")
          print("KERNEL LOCK RELEASED ON DEATH")
          EOF
          grep -q "KERNEL LOCK RELEASED ON DEATH" /tmp/killed.txt

      - name: A hostile directory cannot make a checkpoint write outside it
        run: |
          python - <<'EOF' | tee /tmp/symlink.txt
          import json, os, pathlib, shutil
          from contextmesh_mcp.session import Session, SessionError

          def fresh(case):
              root = pathlib.Path(f"/tmp/hostile-{case}")
              shutil.rmtree(root, ignore_errors=True)
              shutil.copytree("/tmp/session", root, symlinks=True)
              outside = pathlib.Path(f"/tmp/PRECIOUS-{case}.txt")
              outside.write_text("precious")
              return root, outside, json.loads((root / "session.json").read_text())

          results = []
          # The three names a save writes. A rename replaces a planted link
          # rather than following it, so the outside file is never touched.
          for case, key in (("graph", "graph"), ("resolver", "resolver")):
              root, outside, manifest = fresh(case)
              nxt = manifest["generation"] + 1
              stem = "graph" if key == "graph" else "resolver"
              planted = root / f"{stem}-{nxt:06d}.json"
              planted.symlink_to(outside)
              Session.load(root).checkpoint()
              assert outside.read_text() == "precious", f"{case}: wrote through the link"
              assert not planted.is_symlink(), f"{case}: link survived"
              results.append(f"{case}: link replaced, outside intact")

          # The lock cannot be replaced -- it must keep one inode for the
          # kernel lock -- so it is refused instead.
          for case, plant in (
              ("lock-symlink", lambda root, outside: root.joinpath("session.lock").symlink_to(outside)),
              ("lock-fifo", lambda root, outside: os.mkfifo(str(root / "session.lock"))),
          ):
              root, outside, _ = fresh(case)
              (root / "session.lock").unlink()
              plant(root, outside)
              try:
                  Session.load(root).checkpoint()
                  raise SystemExit(f"::error::{case} was accepted as a session lock")
              except SessionError as exc:
                  assert "regular file" in str(exc), str(exc)
              assert outside.read_text() == "precious", f"{case}: outside was written"
              results.append(f"{case}: refused, outside intact")

          for line in results:
              print(" ", line)
          print("HOSTILE DIRECTORY CONTAINED")
          EOF
          grep -q "HOSTILE DIRECTORY CONTAINED" /tmp/symlink.txt

      - name: A checkpoint mid-read does not make a live session look broken
        run: |
          python - <<'EOF' | tee /tmp/reader.txt
          import pathlib, shutil, subprocess, sys, threading, time
          from contextmesh.graph import ContextGraph
          from contextmesh_mcp.session import Session

          shutil.rmtree("/tmp/reader", ignore_errors=True)
          shutil.copytree("/tmp/session", "/tmp/reader")
          root = pathlib.Path("/tmp/reader")
          start = Session.load(root).generation

          # Stall the reader after it has the manifest but before it opens the
          # companions, then commit and sweep underneath it. Without the retry
          # this is a FileNotFoundError on a perfectly healthy directory.
          original = ContextGraph.load_json.__func__
          paused, resume = threading.Event(), threading.Event()
          attempts = []

          def stalling(cls, path, **kwargs):
              attempts.append(path)
              if len(attempts) == 1:
                  paused.set()
                  resume.wait(60)
              return original(cls, path, **kwargs)

          outcome = {}

          def read():
              try:
                  session = Session.load(root)
                  outcome["generation"] = session.generation
                  outcome["nodes"] = len(session.graph.nodes)
              except BaseException as exc:
                  outcome["error"] = f"{type(exc).__name__}: {exc}"

          ContextGraph.load_json = classmethod(stalling)
          reader = threading.Thread(target=read)
          reader.start()
          assert paused.wait(60), "the reader never started"

          ContextGraph.load_json = classmethod(original)
          Session.load(root).checkpoint()
          ContextGraph.load_json = classmethod(stalling)
          resume.set()
          reader.join(120)
          ContextGraph.load_json = classmethod(original)

          assert "error" not in outcome, outcome["error"]
          assert outcome["generation"] == start + 1, outcome
          assert len(attempts) > 1, "the read never retried"
          print(f"  read retried {len(attempts)} times, landed on generation "
                f"{outcome['generation']} with {outcome['nodes']} nodes")

          # And a directory that is genuinely broken must still fail at once.
          shutil.rmtree("/tmp/broken-reader", ignore_errors=True)
          shutil.copytree(str(root), "/tmp/broken-reader")
          broken = pathlib.Path("/tmp/broken-reader")
          import json as _json
          (broken / _json.loads((broken / "session.json").read_text())["graph"]).unlink()
          began = time.time()
          try:
              Session.load(broken)
              raise SystemExit("::error::a directory missing its graph loaded")
          except Exception as exc:
              assert "no such file" in str(exc), str(exc)
          waited = time.time() - began
          assert waited < 1.0, f"a broken directory took {waited:.2f}s to fail"
          print(f"  a genuinely missing companion still fails in {waited * 1000:.0f} ms")
          print("READER SURVIVED A CONCURRENT SWEEP")
          EOF
          grep -q "READER SURVIVED A CONCURRENT SWEEP" /tmp/reader.txt

      - name: A session carries the plan it was mid-repair on
        run: |
          python - <<'EOF' | tee /tmp/v2.txt
          import json, subprocess, sys, tempfile
          from pathlib import Path
          from contextmesh.execute import Runner, TaskRegistry
          from contextmesh_mcp.session import Session

          class Advisory:
              def __init__(self): self.published = False
              def __call__(self, ctx):
                  if self.published and ctx.output.get("impl") == "argon2":
                      return ctx.disproved("CVE-2026-9999 published for argon2id")
                  return True

          def deployment(advisory=None):
              r = TaskRegistry()
              r.register_worker("auth.schema.v1", lambda c: {"ok": True})
              r.register_worker("auth.hash.argon2.v1", lambda c: {"impl": "argon2"})
              r.register_worker("auth.hash.bcrypt.v1", lambda c: {"impl": "bcrypt"})
              r.register_worker("auth.tokens.v1", lambda c: {"ok": True})
              r.register_auditor("auth.hash.audit.v1", advisory or Advisory())
              return r

          base = Session.build(rounds=2)
          adv = Advisory()
          run = Runner("auth", graph=base.graph, registry=deployment(adv))
          run.task("schema", worker_key="auth.schema.v1", assumes="sqlite is fine", produces=("Schema",))
          run.task("hashing", worker_key="auth.hash.argon2.v1", auditor_key="auth.hash.audit.v1",
                   assumes="Argon2 has no open advisory", needs=("schema",), produces=("Password Hasher",))
          run.task("tokens", worker_key="auth.tokens.v1", assumes="JWT is fine",
                   needs=("schema",), produces=("Tokens",))
          run.run()
          adv.published = True
          run.recheck()
          run.repair("hashing", assumes="bcrypt has no open advisory",
                     worker_key="auth.hash.bcrypt.v1")
          base.runner = run

          tmp = Path(tempfile.mkdtemp()) / "session"
          base.save(tmp)
          manifest = json.loads((tmp / "session.json").read_text())
          print(" manifest version:", manifest["version"])
          assert manifest["version"] == 2
          for field in ("graph", "resolver", "execution", "ledger"):
              assert manifest[field] and (tmp / manifest[field]).is_file(), field
              print("   %-10s %s" % (field, manifest[field]))
          print(" ready at the checkpoint:", run._ready())

          # A separate process restores the whole session and finishes the work.
          script = (
              "import json,sys\n"
              "exec(open(sys.argv[2]).read())\n"
              "from contextmesh_mcp.session import Session\n"
              "adv = Advisory(); adv.published = True\n"
              "s = Session.load(sys.argv[1], registry=deployment(adv))\n"
              "assert s.runner is not None\n"
              "assert s.runner._ready() == ['hashing'], s.runner._ready()\n"
              "assert s.runner.ledger.verify()\n"
              "head = s.runner.ledger.head\n"
              "s.runner.run()\n"
              "print(json.dumps({'restored_head': head, "
              "'tasks': {t.name: [t.state.value, t.attempt, t.output] for t in s.runner.tasks}}))\n"
          )
          helper = tmp.parent / "defs.py"
          helper.write_text(
              "class Advisory:\n"
              "    def __init__(self): self.published = False\n"
              "    def __call__(self, ctx):\n"
              "        if self.published and ctx.output.get('impl') == 'argon2':\n"
              "            return ctx.disproved('CVE')\n"
              "        return True\n"
              "def deployment(advisory=None):\n"
              "    from contextmesh.execute import TaskRegistry\n"
              "    r = TaskRegistry()\n"
              "    r.register_worker('auth.schema.v1', lambda c: {'ok': True})\n"
              "    r.register_worker('auth.hash.argon2.v1', lambda c: {'impl': 'argon2'})\n"
              "    r.register_worker('auth.hash.bcrypt.v1', lambda c: {'impl': 'bcrypt'})\n"
              "    r.register_worker('auth.tokens.v1', lambda c: {'ok': True})\n"
              "    r.register_auditor('auth.hash.audit.v1', advisory or Advisory())\n"
              "    return r\n"
          )
          out = subprocess.run([sys.executable, "-c", script, str(tmp), str(helper)],
                               capture_output=True, text=True, timeout=120)
          if out.returncode != 0:
              raise SystemExit("::error::" + out.stderr.strip().splitlines()[-1])
          result = json.loads(out.stdout)
          assert result["restored_head"] == run.ledger.head, "the ledger head moved"
          print(" restored ledger head:  ", result["restored_head"][:32], "...")
          for name, (state, attempt, output) in sorted(result["tasks"].items()):
              print("   %-8s %-6s attempt %s  %s" % (name, state, attempt, output))
          assert result["tasks"]["hashing"][2] == {"impl": "bcrypt"}
          assert result["tasks"]["hashing"][1] == 2
          for untouched in ("schema", "tokens"):
              assert result["tasks"][untouched][1] == 1, untouched
          print("A SESSION RESTORES THE WORK IN PROGRESS")
          EOF
          grep -q "A SESSION RESTORES THE WORK IN PROGRESS" /tmp/v2.txt

      - name: Four companions that were never one session are refused
        run: |
          python - <<'EOF' | tee /tmp/v2refuse.txt
          import json, tempfile
          from pathlib import Path
          from contextmesh.execute import Event, RunLedger, Runner, TaskRegistry
          from contextmesh_mcp.session import Session, SessionError, live_manifest_path

          def deployment():
              r = TaskRegistry()
              r.register_worker("w.v1", lambda c: {"ok": True})
              return r

          base = Session.build(rounds=2)
          run = Runner("plan", graph=base.graph, registry=deployment())
          run.task("only", worker_key="w.v1", assumes="x", produces=("Thing",))
          run.run()
          base.runner = run

          tmp = Path(tempfile.mkdtemp()) / "session"
          base.save(tmp)
          manifest = json.loads((tmp / "session.json").read_text())
          manifest_path = live_manifest_path(tmp)
          assert manifest_path is not None

          def refused(label, registry=deployment()):
              try:
                  Session.load(tmp, registry=registry)
              except SessionError as exc:
                  print(" %-30s refused: %s" % (label, str(exc)[:48]))
                  return True
              print(" %-30s ACCEPTED" % label)
              return False

          # A ledger that verifies perfectly, about a different run.
          stranger = RunLedger()
          stranger.record(1, Event.EXECUTED, "a_task_from_elsewhere", "ran")
          assert stranger.verify(), "the stranger ledger should verify on its own"
          (tmp / manifest["ledger"]).write_text(json.dumps(stranger.snapshot()))
          if not refused("a ledger from another run"):
              raise SystemExit("::error::a foreign ledger was accepted")
          (tmp / manifest["ledger"]).write_text(json.dumps(run.ledger.snapshot()))

          # The manifest commits to a history, not a filename: swapping only
          # the ledger for another internally perfect one is refused.
          resealed = RunLedger()
          resealed.record(1, Event.EXECUTED, "only", "a different history")
          assert resealed.verify(), "the replacement should verify on its own"
          assert resealed.head != manifest["ledger_head"]
          (tmp / manifest["ledger"]).write_text(json.dumps(resealed.snapshot()))
          if not refused("a resealed ledger, same name"):
              raise SystemExit("::error::a swapped ledger was accepted")

          # And with the head updated too, the references still have to close.
          for label, kwargs in (
              ("a ledger citing no such node", {"node_id": "decision:gone"}),
              ("a ledger citing no such ground", {"assumption_id": "assumption:gone"}),
          ):
              dangling = RunLedger()
              dangling.record(1, Event.EXECUTED, "only", "ran", **kwargs)
              (tmp / manifest["ledger"]).write_text(json.dumps(dangling.snapshot()))
              moved = dict(manifest); moved["ledger_head"] = dangling.head
              manifest_path.write_text(json.dumps(moved, indent=2))
              if not refused(label):
                  raise SystemExit("::error::%s was accepted" % label)
          (tmp / manifest["ledger"]).write_text(json.dumps(run.ledger.snapshot()))
          manifest_path.write_text(json.dumps(manifest, indent=2))

          # A plan with no history, and a history with no plan.
          for dropped, kept in (("ledger", "execution"), ("execution", "ledger")):
              broken = dict(manifest); broken[dropped] = None
              manifest_path.write_text(json.dumps(broken, indent=2))
              if not refused("%s with no %s" % (kept, dropped)):
                  raise SystemExit("::error::a half-committed pair was accepted")
          manifest_path.write_text(json.dumps(manifest, indent=2))

          # And the one a directory can never supply.
          try:
              Session.load(tmp)
              raise SystemExit("::error::a keyed session loaded with no registry")
          except SessionError as exc:
              print(" %-30s refused: %s" % ("no registry at all", str(exc)[:48]))
          if not refused("a deployment missing the key", registry=TaskRegistry()):
              raise SystemExit("::error::a deployment without the key was accepted")
          print("A MISMATCHED SESSION FAILS CLOSED")
          EOF
          grep -q "A MISMATCHED SESSION FAILS CLOSED" /tmp/v2refuse.txt

      - name: A graph and a resolver that were never a session together
        run: |
          rm -rf /tmp/mixed && cp -r /tmp/session /tmp/mixed
          python - <<'EOF'
          import json, pathlib
          from contextmesh.graph import ContextGraph
          root = pathlib.Path("/tmp/mixed")
          named = json.loads((root / "session.json").read_text())["graph"]
          ContextGraph().save_json(root / named)
          EOF
          if python -m contextmesh_mcp --session /tmp/mixed >/dev/null 2>/tmp/mixed.txt; then
            echo "::error::a resolver was loaded against a graph it does not match"; exit 1
          fi
          grep -q "not a node in this session's graph" /tmp/mixed.txt

  registry:
    name: registry · durable bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: A durable key never becomes an import
        run: |
          python - <<'EOF' | tee /tmp/registry.txt
          import ast, pathlib
          from contextmesh.execute import TaskRegistry, ExecutionCheckpointError

          # Parsed rather than grepped: a prose "no pickle" in a docstring is
          # not a defect, and a substring scan cannot tell the two apart.
          tree = ast.parse(
              pathlib.Path("contextmesh/execute.py").read_text(encoding="utf-8")
          )
          imported, called = set(), set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split(".")[0])
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  called.add(node.func.id)
          loaders = {"importlib", "pickle", "marshal", "shelve", "runpy", "imp"}
          makers = {"eval", "exec", "compile", "__import__"}
          assert not (loaders & imported), sorted(loaders & imported)
          assert not (makers & called), sorted(makers & called)

          # And a key shaped exactly like a module path resolves to nothing.
          registry = TaskRegistry()
          registry.register_worker("auth.hash.argon2.v1", lambda ctx: {})
          for shaped in ("contextmesh.execute.demo", "os.system", "builtins.eval"):
              try:
                  registry.worker(shaped)
                  raise SystemExit(f"::error::{shaped} resolved to something")
              except ExecutionCheckpointError:
                  pass
          print("  no loader imported, no text turned into behaviour")
          print("A KEY IS ONLY EVER A LOOKUP")
          EOF
          grep -q "A KEY IS ONLY EVER A LOOKUP" /tmp/registry.txt

      - name: A repair moves the durable key before anything reruns
        run: |
          python - <<'EOF' | tee /tmp/argon.txt
          from contextmesh.execute import Runner, TaskRegistry

          def hasher(tag):
              return lambda ctx: {"implementation": tag}

          def deployment():
              r = TaskRegistry()
              r.register_worker("auth.hash.argon2.v1", hasher("argon2"))
              r.register_worker("auth.hash.bcrypt.v1", hasher("bcrypt"))
              r.register_auditor("auth.hash.audit.v1", lambda ctx: True)
              return r

          first = Runner("auth", registry=deployment())
          first.task(
              "hash_password",
              worker_key="auth.hash.argon2.v1",
              auditor_key="auth.hash.audit.v1",
              assumes="Argon2 has no open advisory",
          )
          first.run()
          assert first.output("hash_password")["implementation"] == "argon2"

          # A CVE lands; the assumption is regrounded on bcrypt.
          first.repair(
              "hash_password",
              assumes="bcrypt has no open advisory",
              worker_key="auth.hash.bcrypt.v1",
          )

          # Deliberately no first.run(). This is the dangerous boundary: the
          # repair is done, bcrypt has never executed, and the process dies here.
          # Everything a checkpoint would carry across is these two strings.
          durable = first.bindings()["hash_password"]
          print(" durable binding:", durable)
          assert durable["worker_key"] == "auth.hash.bcrypt.v1", (
              "repair() did not move the durable key; only a later run would have"
          )

          second = Runner("auth", registry=deployment())
          second.task(
              "hash_password",
              worker_key=durable["worker_key"],
              auditor_key=durable["auditor_key"],
              assumes="bcrypt has no open advisory",
          )
          second.run()
          got = second.output("hash_password")["implementation"]
          print(" restored process ran (first execution of bcrypt):", got)
          assert got == "bcrypt", "the restore resurrected the worker the CVE was about"
          print("REPAIRED BINDING SURVIVED THE PROCESS")
          EOF
          grep -q "REPAIRED BINDING SURVIVED THE PROCESS" /tmp/argon.txt

      - name: One durable key cannot mean two implementations
        run: |
          python - <<'EOF' | tee /tmp/one.txt
          import inspect
          from contextmesh.execute import Runner, TaskRegistry, ExecutionCheckpointError

          # The mistake has to be unexpressible, not merely discouraged.
          for method in (Runner.task, Runner.repair):
              params = inspect.signature(method).parameters
              assert "registry" not in params, (
                  "%s still takes a per-call registry=" % method.__name__
              )
          print(" no per-call registry= on task() or repair()")

          argon = TaskRegistry()
          argon.register_worker("auth.hash.v1", lambda ctx: {"implementation": "argon2"})
          rival = TaskRegistry()
          rival.register_worker("auth.hash.v1", lambda ctx: {"implementation": "bcrypt"})

          first = Runner("auth", registry=argon)
          first.task("hash", worker_key="auth.hash.v1", assumes="x")
          first.run()
          ran = first.output("hash")["implementation"]
          key = first.bindings()["hash"]["worker_key"]
          print(" process A ran:", ran, "| checkpoint says:", key)

          second = Runner("auth", registry=argon)
          second.task("hash", worker_key=key, assumes="x")
          second.run()
          got = second.output("hash")["implementation"]
          print(" process B restored:", got)
          assert got == ran, "one key named two implementations across the boundary"

          # rebind() is the one way the meaning changes, and it adopts the table.
          second.rebind(rival)
          assert second.registry is rival
          second.repair("hash", worker_key="auth.hash.v1")
          second.run()
          print(" after rebind(rival), repair binds:", second.output("hash")["implementation"])
          assert second.output("hash")["implementation"] == "bcrypt"
          # The same hole, reached one task at a time.
          third = Runner("auth", registry=argon)
          task = third.task("hash", worker_key="auth.hash.v1", assumes="x")
          try:
              task.rebind(rival)
              raise SystemExit("::error::a task was rebound against a foreign registry")
          except ExecutionCheckpointError as exc:
              print(" one task, foreign table:", str(exc)[:72])
          print("ONE RUNNER MEANS ONE REGISTRY")
          EOF
          grep -q "ONE RUNNER MEANS ONE REGISTRY" /tmp/one.txt

      - name: A deployment missing the key refuses, and can say which
        run: |
          python - <<'EOF' | tee /tmp/missing.txt
          from contextmesh.execute import Runner, TaskRegistry, ExecutionCheckpointError

          stale = TaskRegistry()
          stale.register_worker("auth.hash.argon2.v1", lambda ctx: {})
          stale.register_auditor("auth.hash.audit.v1", lambda ctx: True)

          runner = Runner("auth", registry=stale)
          try:
              runner.task("hash", worker_key="auth.hash.bcrypt.v1", assumes="x")
              raise SystemExit("::error::an unregistered key was accepted")
          except ExecutionCheckpointError as exc:
              assert "auth.hash.bcrypt.v1" in str(exc), str(exc)
              print(" refused:", str(exc)[:96])

          described = stale.describe()
          print(" this deployment can bind:", described)
          assert "auth.hash.bcrypt.v1" not in described["workers"]
          # describe() is names only -- no route back to the code.
          assert "function" not in repr(described) and "lambda" not in repr(described)

          # A plain callable still runs; it simply cannot be checkpointed.
          plain = Runner("plain")
          plain.task("temporary_task", lambda ctx: {"ok": True}, assumes="input is valid")
          plain.run()
          assert plain.output("temporary_task")["ok"] is True
          assert not plain.checkpointable
          try:
              plain.require_checkpointable()
              raise SystemExit("::error::a plain callable plan claimed to be durable")
          except ExecutionCheckpointError as exc:
              print(" plain callable:", str(exc).splitlines()[-1][:96])
          print("MISSING KEYS FAIL CLOSED")
          EOF
          grep -q "MISSING KEYS FAIL CLOSED" /tmp/missing.txt

  ledger:
    name: ledger · restore and continuity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: A restored ledger continues the exact committed history
        run: |
          python - <<'EOF' | tee /tmp/cont.txt
          import json, subprocess, sys, tempfile
          from pathlib import Path
          from contextmesh.execute import RunLedger, Event

          led = RunLedger()
          led.record(1, Event.EXECUTED, "hash_password", "argon2id", data={"hasher": "Argon2id"})
          led.record(1, Event.DISPROVED, "hash_password", "CVE-2026-9999")
          led.record(2, Event.REPAIRED, "hash_password", "reground on bcrypt")
          led.record(2, Event.EXECUTED, "hash_password", "bcrypt", data={"hasher": "Bcrypt"})
          committed = led.head
          print(" process A committed head:", committed[:32], "...")

          tmp = Path(tempfile.mkdtemp())
          led.save_json(tmp / "ledger.json")
          before = json.loads((tmp / "ledger.json").read_text())["entries"]

          # A genuinely separate process restores it and appends one event.
          script = (
              "import json,sys\n"
              "from contextmesh.execute import RunLedger, Event\n"
              "led = RunLedger.load_json(sys.argv[1], expect_head=sys.argv[2])\n"
              "assert led.head == sys.argv[2]\n"
              "assert led.verify()\n"
              "h = led.head\n"
              "e = led.record(3, Event.AUDITED, 'hash_password', 'bcrypt holds')\n"
              "assert e.compute_digest(h) == e.digest, 'new entry did not chain from the old head'\n"
              "led.save_json(sys.argv[1])\n"
              "print(json.dumps({'restored': h, 'new_head': led.head}))\n"
          )
          out = subprocess.run([sys.executable, "-c", script, str(tmp / "ledger.json"), committed],
                               capture_output=True, text=True, timeout=60)
          if out.returncode != 0:
              raise SystemExit("::error::" + out.stderr.strip().splitlines()[-1])
          result = json.loads(out.stdout)
          print(" process B restored head:  ", result["restored"][:32], "...")
          assert result["restored"] == committed

          after = json.loads((tmp / "ledger.json").read_text())["entries"]
          assert after[: len(before)] == before, "the restored prefix was rewritten"
          print(" prefix after the append:  ", len(before), "entries, byte-identical")
          print(" head moved on to:         ", result["new_head"][:32], "...")
          print("RESTORED THE EXACT COMMITTED HEAD")
          EOF
          grep -q "RESTORED THE EXACT COMMITTED HEAD" /tmp/cont.txt

      - name: Edit, delete and reorder are refused; a reforged chain needs the anchor
        run: |
          python - <<'EOF' | tee /tmp/tamper.txt
          from contextmesh.execute import (
              RunLedger, LedgerEntry, Event, LedgerIntegrityError,
          )

          def build():
              led = RunLedger()
              led.record(1, Event.EXECUTED, "hash_password", "argon2id", data={"hasher": "Argon2id"})
              led.record(1, Event.DISPROVED, "hash_password", "CVE-2026-9999")
              led.record(1, Event.INVALIDATED, "auth_routes", "ground removed")
              led.record(2, Event.EXECUTED, "hash_password", "bcrypt", data={"hasher": "Bcrypt"})
              return led

          def reseal(snap):
              """What an attacker with write access does: recompute everything."""
              prev = RunLedger.GENESIS
              for i, row in enumerate(snap["entries"], start=1):
                  row["seq"] = i
                  e = LedgerEntry(seq=i, round=row["round"], event=Event(row["event"]),
                                  task=row["task"], detail=row["detail"],
                                  node_id=row["node_id"], assumption_id=row["assumption_id"],
                                  data=row["data"])
                  row["digest"] = e.compute_digest(prev)
                  prev = row["digest"]
              snap["head"] = prev
              return snap

          trusted = build().head

          def refused(label, snap, anchor=None):
              try:
                  RunLedger.from_snapshot(snap, expect_head=anchor)
              except LedgerIntegrityError as exc:
                  print(" %-34s REFUSED - %s" % (label, str(exc)[:64]))
                  return True
              print(" %-34s ACCEPTED" % label)
              return False

          a = build().snapshot()
          a["entries"][0]["data"]["hasher"] = "Bcrypt"
          assert refused("A. edit a historical entry", a)

          b = build().snapshot()
          del b["entries"][2]
          for i, row in enumerate(b["entries"], start=1):
              row["seq"] = i
          assert refused("B. delete + renumber", b)

          c = build().snapshot()
          c["entries"][1], c["entries"][2] = c["entries"][2], c["entries"][1]
          for i, row in enumerate(c["entries"], start=1):
              row["seq"] = i
          assert refused("C. reorder", c)

          # D. The one internal consistency cannot see.
          d = build().snapshot()
          d["entries"][0]["data"]["hasher"] = "Bcrypt"
          d = reseal(d)
          forged = RunLedger.from_snapshot(d)
          assert forged.verify(), "the forged chain should verify - that is the point"
          print(" D. reforge every digest            ACCEPTED by verify(), head %s..." % d["head"][:16])
          assert refused("D. reforge, against trusted head", d, anchor=trusted)
          print(" trusted head was               %s..." % trusted[:16])
          print("TAMPER EVIDENT, CONTINUITY ANCHORED")
          EOF
          grep -q "TAMPER EVIDENT, CONTINUITY ANCHORED" /tmp/tamper.txt

      - name: A corrupt or foreign ledger file is refused, not half-loaded
        run: |
          python - <<'EOF' | tee /tmp/refuse.txt
          import json, tempfile
          from pathlib import Path
          from contextmesh.execute import RunLedger, Event, LedgerIntegrityError

          led = RunLedger()
          led.record(1, Event.EXECUTED, "t", "d")
          good = led.snapshot()

          cases = {}
          cases["another schema"] = dict(good, schema="contextmesh.graph")
          cases["a future version"] = dict(good, version=99)
          cases["a boolean version"] = dict(good, version=True)
          cases["a truncated head"] = dict(good, head="abc")
          for label, snap in list(cases.items()):
              try:
                  RunLedger.from_snapshot(snap)
                  raise SystemExit("::error::%s was accepted" % label)
              except LedgerIntegrityError as exc:
                  print(" %-20s refused: %s" % (label, str(exc)[:58]))

          # An unsigned field is refused rather than silently dropped, at both
          # levels: the entry record and the container around it.
          extra = json.loads(json.dumps(good))
          extra["entries"][0]["approved_by"] = "someone"
          try:
              RunLedger.from_snapshot(extra)
              raise SystemExit("::error::an unsigned entry field was accepted")
          except LedgerIntegrityError as exc:
              print(" %-20s refused: %s" % ("an unsigned field", str(exc)[:58]))

          outer = dict(good, external_anchor="https://example.invalid/notarised")
          try:
              RunLedger.from_snapshot(outer)
              raise SystemExit("::error::an undefined container field was accepted")
          except LedgerIntegrityError as exc:
              print(" %-20s refused: %s" % ("an undefined v1 field", str(exc)[:58]))

          # Duplicate JSON keys: one name, two values, no agreed meaning.
          assert json.loads('{"a": 1, "a": 2}') == {"a": 2}, "python keeps the last"
          tmp0 = Path(tempfile.mkdtemp()) / "dup.json"
          led2 = RunLedger()
          led2.record(1, Event.EXECUTED, "t", "d", data={"hasher": "Argon2id"})
          dup = led2.to_json().replace(
              '"hasher": "Argon2id"', '"hasher": "Argon2id", "hasher": "Bcrypt"', 1
          )
          assert '"hasher": "Bcrypt"' in dup, "the duplicate was not injected"
          tmp0.write_text(dup)
          try:
              RunLedger.load_json(tmp0)
              raise SystemExit("::error::a duplicate key in signed data was accepted")
          except LedgerIntegrityError as exc:
              print(" %-20s refused: %s" % ("a duplicate in data", str(exc)[:58]))

          # NaN never reaches a file, at either end.
          tmp = Path(tempfile.mkdtemp()) / "l.json"
          bad = json.loads(json.dumps(good))
          tmp.write_text(json.dumps(bad).replace('"data": {}', '"data": {"x": NaN}', 1))
          try:
              RunLedger.load_json(tmp)
              raise SystemExit("::error::NaN was parsed")
          except LedgerIntegrityError as exc:
              print(" %-20s refused: %s" % ("NaN in the file", str(exc)[:58]))
          print("A BAD LEDGER FAILS CLOSED")
          EOF
          grep -q "A BAD LEDGER FAILS CLOSED" /tmp/refuse.txt

  execution:
    name: execution · restore and reschedule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: A repaired plan restores with the same schedule and reruns selectively
        run: |
          python - <<'EOF' | tee /tmp/exec.txt
          import json, subprocess, sys, tempfile
          from pathlib import Path
          from contextmesh.execute import Runner, TaskRegistry

          class Advisory:
              def __init__(self): self.published = False
              def __call__(self, ctx):
                  if self.published and ctx.output.get("impl") == "argon2":
                      return ctx.disproved("CVE-2026-9999 published for argon2id")
                  return True

          def deployment(advisory=None):
              r = TaskRegistry()
              r.register_worker("auth.schema.v1", lambda c: {"ok": True})
              r.register_worker("auth.hash.argon2.v1", lambda c: {"impl": "argon2"})
              r.register_worker("auth.hash.bcrypt.v1", lambda c: {"impl": "bcrypt"})
              r.register_worker("auth.routes.v1", lambda c: {"ok": True})
              r.register_worker("auth.tokens.v1", lambda c: {"ok": True})
              r.register_auditor("auth.hash.audit.v1", advisory or Advisory())
              return r

          advisory = Advisory()
          a = Runner("auth", registry=deployment(advisory))
          a.task("schema", worker_key="auth.schema.v1", assumes="sqlite is fine", produces=("Schema",))
          a.task("hashing", worker_key="auth.hash.argon2.v1", auditor_key="auth.hash.audit.v1",
                 assumes="Argon2 has no open advisory", needs=("schema",), produces=("Password Hasher",))
          a.task("routes", worker_key="auth.routes.v1", assumes="REST is fine",
                 needs=("hashing",), produces=("Routes",))
          a.task("tokens", worker_key="auth.tokens.v1", assumes="JWT is fine",
                 needs=("schema",), produces=("Tokens",))
          a.run()
          print(" run 1:", {t.name: t.state.value for t in a.tasks})

          advisory.published = True
          a.recheck()
          a.repair("hashing", assumes="bcrypt has no open advisory",
                   worker_key="auth.hash.bcrypt.v1")
          print(" after CVE + repair:", {t.name: t.state.value for t in a.tasks})
          print(" attempts:", {t.name: t.attempt for t in a.tasks})

          ready = a._ready()
          print(" ready at the checkpoint:", ready)
          assert ready == ["hashing"], ready

          tmp = Path(tempfile.mkdtemp())
          a.save_json(tmp / "execution.json")
          a.graph.save_json(tmp / "graph.json")
          a.ledger.save_json(tmp / "ledger.json")
          order = [t["name"] for t in json.loads((tmp / "execution.json").read_text())["tasks"]]
          print(" task order in the file:", order)
          assert order == ["schema", "hashing", "routes", "tokens"], order
          assert order != sorted(order), "the file must not be sorted"

          # A separate process: the file, the graph, the ledger, its own registry.
          script = (
              "import json,sys\n"
              "from contextmesh.execute import Runner, TaskRegistry\n"
              "from contextmesh.graph import ContextGraph\n"
              "from contextmesh.execute import RunLedger\n"
              "exec(open(sys.argv[2]).read())\n"
              "g = ContextGraph.load_json(sys.argv[1] + '/graph.json')\n"
              "led = RunLedger.load_json(sys.argv[1] + '/ledger.json')\n"
              "adv = Advisory(); adv.published = True\n"
              "r = Runner.load_json(sys.argv[1] + '/execution.json', graph=g,\n"
              "                     registry=deployment(adv), ledger=led)\n"
              "assert r._ready() == ['hashing'], r._ready()\n"
              "assert r['hashing'].worker_key == 'auth.hash.bcrypt.v1'\n"
              "r.run()\n"
              "print(json.dumps({t.name: [t.state.value, t.attempt, t.output] for t in r.tasks}))\n"
          )
          helper = tmp / "defs.py"
          helper.write_text(
              "class Advisory:\n"
              "    def __init__(self): self.published = False\n"
              "    def __call__(self, ctx):\n"
              "        if self.published and ctx.output.get('impl') == 'argon2':\n"
              "            return ctx.disproved('CVE')\n"
              "        return True\n"
              "def deployment(advisory=None):\n"
              "    from contextmesh.execute import TaskRegistry\n"
              "    r = TaskRegistry()\n"
              "    r.register_worker('auth.schema.v1', lambda c: {'ok': True})\n"
              "    r.register_worker('auth.hash.argon2.v1', lambda c: {'impl': 'argon2'})\n"
              "    r.register_worker('auth.hash.bcrypt.v1', lambda c: {'impl': 'bcrypt'})\n"
              "    r.register_worker('auth.routes.v1', lambda c: {'ok': True})\n"
              "    r.register_worker('auth.tokens.v1', lambda c: {'ok': True})\n"
              "    r.register_auditor('auth.hash.audit.v1', advisory or Advisory())\n"
              "    return r\n"
          )
          out = subprocess.run([sys.executable, "-c", script, str(tmp), str(helper)],
                               capture_output=True, text=True, timeout=90)
          if out.returncode != 0:
              raise SystemExit("::error::" + out.stderr.strip().splitlines()[-1])
          final = json.loads(out.stdout)
          for name, (state, attempt, output) in sorted(final.items()):
              print("   %-8s %-6s attempt %s  %s" % (name, state, attempt, output))

          assert final["hashing"][2] == {"impl": "bcrypt"}, "the restore resurrected argon2"
          assert final["hashing"][1] == 2, "the repaired task did not rerun"
          for untouched in ("schema", "tokens"):
              assert final[untouched][1] == 1, untouched + " reran but was never stale"
          print("RESTORED PLAN RERAN ONLY THE STALE CLOSURE")
          EOF
          grep -q "RESTORED PLAN RERAN ONLY THE STALE CLOSURE" /tmp/exec.txt

      - name: A plan that does not match its graph is refused, not half-loaded
        run: |
          python - <<'EOF' | tee /tmp/execrefuse.txt
          from contextmesh.execute import (
              Runner, TaskRegistry, ExecutionSnapshotError, ExecutionCheckpointError,
          )
          from contextmesh.graph import ContextGraph

          registry = TaskRegistry()
          registry.register_worker("w.v1", lambda ctx: {"ok": True})
          runner = Runner("plan", registry=registry)
          runner.task("only", worker_key="w.v1", assumes="x", produces=("Thing",))
          runner.run()
          good = runner.snapshot()

          def refused(label, snap, graph=None, reg=None):
              try:
                  Runner.from_snapshot(snap, graph=graph or runner.graph,
                                       registry=reg or registry)
              except (ExecutionSnapshotError, ExecutionCheckpointError) as exc:
                  print(" %-26s refused: %s" % (label, str(exc)[:54]))
                  return True
              print(" %-26s ACCEPTED" % label)
              return False

          import copy
          cases = []
          bad = copy.deepcopy(good); bad["tasks"][0]["assumption_id"] = "assumption:invented"
          cases.append(("a dangling assumption", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["node_id"] = "decision:invented"
          cases.append(("a dangling decision", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["artefacts"] = ["entity:invented"]
          cases.append(("a dangling artefact", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["needs"] = ["nobody"]
          cases.append(("a dependency on nothing", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["state"] = "blocked"
          cases.append(("blocked as a stored state", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"].append(copy.deepcopy(good["tasks"][0]))
          cases.append(("a task named twice", bad, None, None))
          bad = copy.deepcopy(good); bad["approved_by"] = "alice"
          cases.append(("an undefined v1 field", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["assumption_id"] = None
          cases.append(("a task with no ground", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["assumes"] = "something else entirely"
          cases.append(("ground text vs binding", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["node_id"] = None
          cases.append(("done with no decision", bad, None, None))
          bad = copy.deepcopy(good); bad["tasks"][0]["attempt"] = 0
          cases.append(("done after no attempts", bad, None, None))
          bad = copy.deepcopy(good); bad["plan"] = "a-different-plan"
          cases.append(("a plan the graph never ran", bad, None, None))
          cases.append(("a different graph entirely", copy.deepcopy(good), ContextGraph(), None))
          cases.append(("a deployment without the key", copy.deepcopy(good), None, TaskRegistry()))

          for label, snap, graph, reg in cases:
              if not refused(label, snap, graph, reg):
                  raise SystemExit("::error::%s was accepted" % label)

          # `plan` is durable because ids are derived from it, so changing only
          # that string must not graft the old decisions onto a new namespace.
          from contextmesh.model import slug as _slug
          bogus = _slug("execution plan: a-different-plan", "source")
          assert bogus not in runner.graph.nodes
          renamed = copy.deepcopy(good); renamed["plan"] = "a-different-plan"
          try:
              Runner.from_snapshot(renamed, graph=runner.graph, registry=registry)
              raise SystemExit("::error::a renamed plan was accepted")
          except ExecutionSnapshotError:
              pass
          assert bogus not in runner.graph.nodes, "the renamed plan still created a source"
          print(" %-26s and no source node landed" % "a renamed plan:")

          # A cycle is refused at load, not left for run() to discover -- and
          # the refusal happens before the Runner exists, so nothing lands.
          from contextmesh.model import slug
          two = Runner("cyc", registry=registry)
          two.task("a", worker_key="w.v1", assumes="alpha")
          two.task("b", worker_key="w.v1", assumes="beta")
          cyc = two.snapshot()
          cyc["tasks"][0]["needs"] = ["b"]
          cyc["tasks"][1]["needs"] = ["a"]
          cyc["plan"] = "cyc-restored"
          source = slug("execution plan: cyc-restored", "source")
          assert source not in two.graph.nodes
          try:
              Runner.from_snapshot(cyc, graph=two.graph, registry=registry)
              raise SystemExit("::error::a dependency cycle was accepted")
          except ExecutionSnapshotError as exc:
              print(" %-26s refused: %s" % ("a dependency cycle", str(exc)[:54]))
          assert source not in two.graph.nodes, "the refused plan still left a source node"
          print(" %-26s nothing landed in the graph" % "and before construction:")
          print("A BAD PLAN FAILS CLOSED")
          EOF
          grep -q "A BAD PLAN FAILS CLOSED" /tmp/execrefuse.txt

  smoke:
    name: cli · demo · export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The worked example runs end to end
        run: python -m contextmesh --rounds 4 demo

      - name: A question answers with a path
        run: |
          python -m contextmesh --rounds 2 ask "What made the sharding rule wrong?" \
            | tee /tmp/ask.txt
          grep -q "derived_from" /tmp/ask.txt

      - name: An out-of-corpus question dead-ends rather than guessing
        run: |
          python -m contextmesh --rounds 2 ask "What is the refund policy for annual plans?" \
            | tee /tmp/dead.txt
          grep -q "dead end" /tmp/dead.txt

      - name: Re-execution reruns the blast radius and caches the rest
        run: |
          python -m contextmesh execute | tee /tmp/exec.txt
          # Round 1 builds everything; the rerun after the CVE must touch three
          # steps and leave the two independent ones on their cached result.
          grep -q "ROUND 1 · 5 executed, 0 cached" /tmp/exec.txt
          grep -q "3 executed, 2 cached" /tmp/exec.txt
          grep -q "chain intact: True" /tmp/exec.txt
          # The blast radius must be readable off the ledger on its own, with
          # both halves: what fell, and what was deliberately left standing.
          grep -q "RECEIPT · the whole event, read back off the ledger alone" /tmp/exec.txt
          grep -q "stood      16 node(s) untouched" /tmp/exec.txt
          # The disproof has to come from the auditor reading the advisory feed,
          # not from the script announcing it.
          grep -q "discovered by an auditor" /tmp/exec.txt
          grep -q "CVE-2026-9999" /tmp/exec.txt

      - name: The standalone control-layer example still passes its own checks
        run: |
          python examples/assumption_control_layer.py | tee /tmp/acl.txt
          grep -q "ALL ACCEPTANCE CHECKS PASSED" /tmp/acl.txt

      - name: A saved graph reloads into the same graph
        run: |
          python - <<'EOF' | tee /tmp/persist.txt
          import tempfile, pathlib
          from contextmesh.demo import run
          from contextmesh.graph import ContextGraph
          g = run(rounds=4).graph
          with tempfile.TemporaryDirectory() as tmp:
              p = pathlib.Path(tmp) / "graph.json"
              g.save_json(p)
              back = ContextGraph.load_json(p)
              # Saving the reload must reproduce the file byte for byte.
              q = pathlib.Path(tmp) / "again.json"
              back.save_json(q)
              assert p.read_bytes() == q.read_bytes(), "snapshot is not stable"
              print(f"nodes {len(back.nodes)} edges {len(back.edges)} "
                    f"assumptions {len(back.assumptions)} bytes {p.stat().st_size:,}")
          assert back.to_dict() == g.to_dict()
          assert back.untyped_edges == 0
          print("SNAPSHOT ROUND TRIP OK")
          EOF
          grep -q "SNAPSHOT ROUND TRIP OK" /tmp/persist.txt

      - name: A corrupt snapshot is refused rather than loaded
        run: |
          python - <<'EOF'
          import json
          from contextmesh.demo import run
          from contextmesh.graph import ContextGraph, SnapshotError
          from contextmesh.ontology import OntologyError
          payload = json.loads(json.dumps(run(rounds=2).graph.to_dict()))
          edge = next(e for e in payload["edges"] if e["type"] == "mentions")
          edge["type"] = "resolves_to"
          edge["id"] = "edge:hand-written"
          try:
              ContextGraph.from_dict(payload)
          except OntologyError as exc:
              print("illegal pair refused on load:", str(exc)[:70])
          else:
              raise SystemExit("::error::a snapshot bypassed GRAPH.md on load")
          EOF

      - name: The build is reproducible across hash seeds
        run: |
          PYTHONHASHSEED=0    python -m contextmesh export --out /tmp/a.json
          PYTHONHASHSEED=9999 python -m contextmesh export --out /tmp/b.json
          cmp /tmp/a.json /tmp/b.json \
            || { echo "::error::export is not deterministic across PYTHONHASHSEED"; exit 1; }

      - name: The dashboard's committed data matches what the engine produces
        run: |
          python -m contextmesh export --out /tmp/fresh.json
          cmp /tmp/fresh.json dashboard/data/mesh.json || {
            echo "::error::dashboard/data/mesh.json is stale — run: python -m contextmesh export --inline"
            diff <(python -m json.tool /tmp/fresh.json) \
                 <(python -m json.tool dashboard/data/mesh.json) | head -40
            exit 1
          }

      - name: The dashboard bundles into one self-contained file
        run: |
          python dashboard/bundle.py /tmp/bundled.html
          grep -q "<script id=\"mesh-data\"" /tmp/bundled.html
          # -qv would pass on any file with a single non-matching line; the
          # assertion is that the reference is absent from the file entirely.
          ! grep -q "src=\"mesh.js\"" /tmp/bundled.html

      - name: The committed single-file dashboard is not stale
        # dashboard/context-mesh.html is generated from index.html, mesh.js and
        # data/mesh.json. Committing a build product is only worth it if
        # something notices when it drifts from its sources.
        run: |
          cmp /tmp/bundled.html dashboard/context-mesh.html || {
            echo "::error::dashboard/context-mesh.html is stale — run: python dashboard/bundle.py dashboard/context-mesh.html"
            exit 1
          }
