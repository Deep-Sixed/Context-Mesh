[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextmesh"
version = "0.1.0"
description = "A typed context graph for AI agents: provenance, assumptions, and answers that walk a path you can read."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["knowledge-graph", "provenance", "agents", "retrieval", "context"]
dependencies = []

[project.urls]
Homepage = "https://github.com/charlessnydercareer/Context-Mesh"

[project.scripts]
contextmesh = "contextmesh.cli:main"

[tool.setuptools]
packages = ["contextmesh"]

[tool.setuptools.package-data]
contextmesh = ["../GRAPH.md"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The corpus is prose. Wrapping a document's sentences mid-clause to satisfy a
# column limit makes the source material harder to read than the limit is worth.
"contextmesh/corpus.py" = ["E501"]
